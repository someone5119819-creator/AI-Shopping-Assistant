services:
  sourcebot:
    image: ghcr.io/sourcebot-dev/sourcebot:latest
    pull_policy: always
    user: root
    restart: always
    container_name: sourcebot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "54321:3000"
    volumes:
      - ./config.json:/data/config.json
      - ..:/repos/shopify_rag:ro
      - sourcebot_data:/data
    environment:
      - CONFIG_PATH=/data/config.json
      - AUTH_URL=http://localhost:54321
      - AUTH_SECRET=bYbVAS4digqDe0pjY5r6VCVsk4ApODoub93dzlS0bf3Q
      - SOURCEBOT_ENCRYPTION_KEY=pv9uIgnxFXszQkoFPfYoQfOew72nSyV+
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      - GOOGLE_GENERATIVE_AI_API_KEY=${GEMINI_API_KEY}

  postgres:
    image: docker.io/postgres:16
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - sourcebot_postgres_data:/var/lib/postgresql/data

  redis:
    image: docker.io/redis:8
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - sourcebot_redis_data:/data

volumes:
  sourcebot_data:
  sourcebot_postgres_data:
  sourcebot_redis_data:
